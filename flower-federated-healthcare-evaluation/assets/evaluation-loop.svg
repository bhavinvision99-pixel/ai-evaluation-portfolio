<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Flower federated healthcare evaluation loop</title>
  <desc id="desc">Three hospitals keep synthetic patient data locally, validate terminology and calculations, send aggregate outputs for participation checking and collation, then support comparison and human investigation. Failed checks return to the relevant earlier stage.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#111827"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/></marker>
    <style>
      .title{font:800 58px Arial,sans-serif;fill:#111827}.sub{font:400 24px Arial,sans-serif;fill:#374151}.label{font:700 24px Arial,sans-serif;fill:#111827}.small{font:400 20px Arial,sans-serif;fill:#374151}.micro{font:700 17px Arial,sans-serif;fill:#111827;letter-spacing:1px}.box{stroke:#111827;stroke-width:4;rx:18;filter:url(#shadow)}.line{fill:none;stroke:#111827;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FFF9EE"/>
  <rect x="48" y="44" width="18" height="114" fill="#6D5EF7"/>
  <text x="92" y="92" class="title">Correct maths can still produce</text>
  <text x="92" y="153" class="title">an incomplete federated result.</text>
  <text x="92" y="196" class="sub">The evaluation follows the evidence from local hospital data to human interpretation.</text>

  <text x="72" y="277" class="micro">LOCAL HOSPITAL BOUNDARY</text>
  <rect x="64" y="302" width="364" height="410" class="box" fill="#DDF7EA"/>
  <rect x="100" y="340" width="292" height="72" class="box" fill="#FFFFFF"/><text x="246" y="385" text-anchor="middle" class="label">Hospital A</text>
  <rect x="100" y="442" width="292" height="72" class="box" fill="#FFFFFF"/><text x="246" y="487" text-anchor="middle" class="label">Hospital B</text>
  <rect x="100" y="544" width="292" height="72" class="box" fill="#FFFFFF"/><text x="246" y="589" text-anchor="middle" class="label">Hospital C</text>
  <text x="246" y="660" text-anchor="middle" class="small">Synthetic patient data stays local</text>
  <text x="246" y="690" text-anchor="middle" class="small">Only hospital-level outputs move on</text>

  <path d="M428 505 H490" class="line"/>
  <rect x="500" y="302" width="350" height="410" class="box" fill="#FFE3A3"/>
  <text x="675" y="362" text-anchor="middle" class="label">Local checks</text>
  <circle cx="555" cy="425" r="15" fill="#FF6B57" stroke="#111827" stroke-width="3"/><text x="590" y="433" class="small">Validate fields</text>
  <circle cx="555" cy="492" r="15" fill="#FF6B57" stroke="#111827" stroke-width="3"/><text x="590" y="500" class="small">Map clinical terms</text>
  <circle cx="555" cy="559" r="15" fill="#FF6B57" stroke="#111827" stroke-width="3"/><text x="590" y="567" class="small">Calculate metrics</text>
  <circle cx="555" cy="626" r="15" fill="#FF6B57" stroke="#111827" stroke-width="3"/><text x="590" y="634" class="small">Check known answers</text>
  <text x="675" y="688" text-anchor="middle" class="micro">PCR = POSTERIOR CAPSULE RUPTURE</text>

  <path d="M850 505 H912" class="line"/>
  <rect x="922" y="302" width="610" height="410" class="box" fill="#DCD8FF"/>
  <text x="1227" y="362" text-anchor="middle" class="label">Federated checks</text>
  <rect x="970" y="402" width="225" height="100" class="box" fill="#FFFFFF"/><text x="1082" y="442" text-anchor="middle" class="label">Participation</text><text x="1082" y="476" text-anchor="middle" class="small">Expected = actual?</text>
  <path d="M1195 452 H1250" class="line"/>
  <rect x="1260" y="402" width="225" height="100" class="box" fill="#FFFFFF"/><text x="1372" y="442" text-anchor="middle" class="label">Collation</text><text x="1372" y="476" text-anchor="middle" class="small">Complete + correct?</text>
  <rect x="970" y="562" width="515" height="88" class="box" fill="#FF8A78"/><text x="1227" y="601" text-anchor="middle" class="label">Stop if a hospital is missing</text><text x="1227" y="632" text-anchor="middle" class="small">Flag the result as incomplete</text>
  <path d="M1372 502 V550" class="line"/>

  <path d="M1227 712 V775" class="line"/>
  <rect x="760" y="786" width="772" height="142" class="box" fill="#FFFFFF"/>
  <text x="1146" y="838" text-anchor="middle" class="label">Compare → question → investigate → interpret</text>
  <text x="1146" y="880" text-anchor="middle" class="small">An anomaly starts a human review. It doesn't finish one.</text>

  <path d="M760 858 H675 C600 858 570 815 570 742" class="line"/>
  <rect x="74" y="788" width="582" height="142" class="box" fill="#111827"/>
  <text x="365" y="837" text-anchor="middle" style="font:700 24px Arial,sans-serif;fill:#FFFFFF">FAIL → FIX → RETEST → KEEP THE TEST</text>
  <text x="365" y="882" text-anchor="middle" style="font:400 20px Arial,sans-serif;fill:#FFFFFF">First-run failures stay visible in the record.</text>
  <text x="1526" y="970" text-anchor="end" class="micro">BHAVIN SHAH · AI EVALUATION PORTFOLIO</text>
</svg>
